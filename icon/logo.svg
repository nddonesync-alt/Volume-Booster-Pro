<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE0B" />
      <stop offset="100%" stop-color="#FB5607" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Outer Ambient Glow Ring -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.4" />

  <!-- Dynamic Soundwaves -->
  <g filter="url(#glow)">
    <!-- Speaker Body -->
    <path d="M 140 200 L 190 200 L 255 140 L 255 372 L 190 312 L 140 312 Z" fill="url(#primaryGrad)" />
    
    <!-- Sound Wave 1 (Inner) -->
    <path d="M 290 210 Q 325 256 290 302" fill="none" stroke="#00F5D4" stroke-width="22" stroke-linecap="round" />
    
    <!-- Sound Wave 2 (Middle) -->
    <path d="M 335 175 Q 395 256 335 337" fill="none" stroke="#00BBF9" stroke-width="22" stroke-linecap="round" />
    
    <!-- Sound Wave 3 (Outer Powerful) -->
    <path d="M 380 140 Q 465 256 380 372" fill="none" stroke="#7B2CBF" stroke-width="22" stroke-linecap="round" />

    <!-- Power Lightning Bolt in Speaker -->
    <path d="M 195 215 L 175 260 L 195 260 L 180 300 L 220 250 L 198 250 Z" fill="url(#boltGrad)" />
  </g>
</svg>